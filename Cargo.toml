[package]
name = "zaroz-example-dockerfile-rust"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }

[profile.release]
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
